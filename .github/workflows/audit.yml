name: Final E2E Data Integrity Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Inject Google Credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
      - name: Execute Mathematical Audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/audit_sheets.js

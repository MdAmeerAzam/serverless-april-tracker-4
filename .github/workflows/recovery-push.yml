name: One-Time Targeted Recovery Push

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recovery-push.yml'

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
      - name: Run Targeted Recovery Push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/recovery_currency.js
